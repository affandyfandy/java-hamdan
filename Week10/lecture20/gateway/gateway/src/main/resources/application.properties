spring.application.name=gateway
spring.cloud.gateway.routes[0].id=product
spring.cloud.gateway.routes[0].uri=lb://product
spring.cloud.gateway.routes[0].predicates[0]=Path=/products/**
spring.cloud.gateway.routes[0].filters[0].name=ApiKeyFilter

spring.cloud.gateway.routes[1].id=invoice
spring.cloud.gateway.routes[1].uri=lb://invoice
spring.cloud.gateway.routes[1].predicates[0]=Path=/invoices/**
spring.cloud.gateway.routes[1].filters[0].name=ApiKeyFilter

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
