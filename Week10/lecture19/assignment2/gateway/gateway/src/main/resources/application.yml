spring:
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/products/**
          filters:
            - name: ApiKeyFilter
        - id: invoice-service
          uri: http://localhost:8081
          predicates:
            - Path=/invoices/**
          filters:
            - name: ApiKeyFilter
