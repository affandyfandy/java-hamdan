<header class="py-6 text-white shadow-lg bg-gradient-to-r from-blue-500 to-blue-700">
    <div class="container flex items-center justify-between px-6 mx-auto">
        <div class="logo">
            <h1 class="m-0 text-2xl font-extrabold tracking-wide">Midterm Projects</h1>
        </div>
        <nav class="nav">
            <ul class="flex gap-6 p-0 m-0 list-none">
                <li>
                    <a href="#" class="px-4 py-2 text-base font-medium text-white transition duration-300 hover:bg-white hover:text-blue-700 hover:rounded-full">Products</a>
                </li>
                <li>
                    <a href="#" class="px-4 py-2 text-base font-medium text-white transition duration-300 hover:bg-white hover:text-blue-700 hover:rounded-full">Sales</a>
                </li>
                <li>
                    <a href="#" class="px-4 py-2 text-base font-medium text-white transition duration-300 hover:bg-white hover:text-blue-700 hover:rounded-full">Customer Information</a>
                </li>
            </ul>
        </nav>
        <div class="flex items-center gap-4 user-info">
            <fa-icon [icon]="faUser" class="text-2xl text-white"></fa-icon>
            <span class="text-base">Welcome, User</span>
            <button class="px-5 py-2 text-sm font-semibold text-white transition duration-300 bg-red-600 rounded-full hover:bg-red-800">Logout</button>
        </div>
    </div>
</header>
