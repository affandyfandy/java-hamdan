server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://localhost:8083
          predicates:
            - Path=/products/**
        - id: invoice-service
          uri: http://localhost:8082
          predicates:
            - Path=/invoices/**

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public_key.pem
